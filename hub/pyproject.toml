[project]
name = "playset-hub"
version = "0.1.0"
description = "Playset Buttons hub: reads button presses from the ESP-NOW dongle, plays themed clips, serves the phone UI"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-aiohttp>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["playset_hub"]
